<body data-root="" data-page="settings" data-nav="">
<div class="page">
<div id="site-header"></div>
<div class="page-head"><h1>Settings</h1></div>
<div class="settings-grid">
  <nav>
    <a class="active" href="settings.html">General & Security</a>
    <a href="edit-profile.html">Edit profile</a>
    <a href="saved.html">Saved</a>
  </nav>
  <div style="display:flex;flex-direction:column;gap:18px">
    <div class="card" style="padding:22px">
      <h2 style="font-size:17px;margin-bottom:14px">Preferences</h2>
      <div class="switch"><label for="notif_email">Email notifications</label><input type="checkbox" id="notif_email"></div>
      <div class="switch"><label for="notif_push">Push notifications</label><input type="checkbox" id="notif_push"></div>
      <div class="switch"><label for="private">Private profile</label><input type="checkbox" id="private"></div>
      <div class="switch"><label for="dark">Dark mode</label><input type="checkbox" id="dark"></div>
    </div>

    <div class="card" style="padding:22px">
      <h2 style="font-size:17px;margin-bottom:6px">Change Password</h2>
      <p class="muted" style="font-size:13px;margin-bottom:14px">Update your password to keep your NaijaVibe account secure.</p>
      <form id="password-form" class="form" novalidate>
        <div class="field">
          <label for="current_password">Current password</label>
          <input class="input" type="password" id="current_password" name="current_password" required minlength="8" placeholder="Enter current password">
        </div>
        <div class="field">
          <label for="new_password">New password</label>
          <input class="input" type="password" id="new_password" name="new_password" required minlength="8" placeholder="At least 8 characters">
        </div>
        <div class="field">
          <label for="confirm_password">Confirm new password</label>
          <input class="input" type="password" id="confirm_password" name="confirm_password" required minlength="8" placeholder="Repeat new password">
        </div>
        <button class="btn btn-primary btn-sm" type="submit" id="save-pw-btn">Update password</button>
      </form>
    </div>

    <div class="card" style="padding:22px;border:1px solid rgba(220,53,69,0.3)">
      <h2 style="font-size:17px;color:var(--danger, #dc3545);margin-bottom:6px">Danger Zone</h2>
      <p class="muted" style="font-size:13px;margin-bottom:14px">Permanently delete your account, published stories, comments, and live activity.</p>
      <button class="btn btn-danger btn-sm" id="delete" type="button">Delete account</button>
    </div>
  </div>
</div>
<div id="site-footer"></div>
</div>
