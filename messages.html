<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messages · NaijaVibe</title>
<meta name="description" content="Private text messages with people on NaijaVibe.">
<meta name="theme-color" content="#0b8f3e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logos/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body data-root="" data-page="messages" data-nav="">
<div class="page">
<div id="site-header"></div>
<main class="messages-page">
  <h1>Messages</h1>
  <p class="messages-intro">Private text conversations. Voice and video calls are not available.</p>
  <div class="messages-layout">
    <aside class="messages-sidebar">
      <label for="people-search">Find people</label>
      <input id="people-search" class="input" type="search" placeholder="Search username or name" autocomplete="off">
      <div id="people-results" class="people-results" aria-live="polite"></div>
      <h2>Your conversations</h2>
      <div id="conversation-list" class="conversation-list" aria-live="polite"></div>
    </aside>
    <section class="conversation-panel" aria-label="Selected conversation">
      <div id="conversation-empty" class="conversation-empty">Choose a conversation or find someone to message.</div>
      <div id="conversation-view" hidden>
        <header class="conversation-header">
          <span id="peer-avatar" class="message-avatar"></span>
          <div><b id="peer-name"></b><small id="peer-status"></small></div>
        </header>
        <div id="message-list" class="message-list" aria-live="polite"></div>
        <form id="message-form" class="message-form">
          <label class="sr-only" for="message-input">Write a message</label>
          <textarea id="message-input" name="body" class="input" maxlength="2000" rows="1" placeholder="Write a message…" required></textarea>
          <button class="btn btn-primary" type="submit" aria-label="Send message">Send</button>
        </form>
      </div>
    </section>
  </div>
</main>
<div id="site-footer"></div>
</div>
