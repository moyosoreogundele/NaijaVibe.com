<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · NaijaVibe</title>
<meta name="description" content="Discover the real Nigeria: people, culture, food, places and stories.">
<meta name="theme-color" content="#0b8f3e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/logos/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body data-root="" data-page="profile" data-nav="">
<div class="page">
<div id="site-header"></div>
<div class="profile-cover"></div>
<div class="profile-head">
  <img class="avatar" id="p-avatar" alt="User avatar">
  <div style="padding-bottom:6px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <h1 id="p-name" style="font-size:22px;margin:0"></h1>
      <span id="p-state" class="badge" style="font-size:12px;background:rgba(11,143,62,0.1);color:var(--green-dark);border-radius:12px;padding:2px 8px;display:none"></span>
    </div>
    <span class="muted" id="p-user"></span>
  </div>
  <span style="flex:1"></span>
  <div id="p-actions" style="display:flex;gap:8px">
    <a class="btn btn-outline btn-sm" id="p-edit-btn" href="edit-profile.html">Edit profile</a>
    <a class="btn btn-outline btn-sm" id="p-message-btn" href="messages.html" hidden>Message</a>
    <button class="btn btn-primary btn-sm" id="p-follow-btn" type="button" style="display:none">Follow</button>
  </div>
</div>
<p style="padding:10px var(--gutter);max-width:760px;margin:0 auto" id="p-bio"></p>
<div class="profile-stats">
  <span><b id="p-count">0</b> posts</span>
  <span><b id="p-followers">0</b> followers</span>
  <span><b id="p-following">0</b> following</span>
</div>
<div class="container" style="max-width:760px">
  <div class="feed" id="p-posts"></div>
</div>
<div id="site-footer"></div>
</div>
<script src="js/config.js"></script>
<script src="states/state-data.js"></script>
<script src="js/utils.js"></script>
<script src="js/theme.js"></script>

<script src="js/services/follows.service.js"></script>
<script src="js/services/uploads.service.js"></script>
<script src="js/services/events.service.js"></script>
<script src="js/services/businesses.service.js"></script>
<script src="js/services/products.service.js"></script>
<script src="js/services/reports.service.js"></script>
<script src="js/validation.js"></script>
<script src="js/router.js"></script>

<script src="js/search.js"></script>
<script src="js/notifications.js"></script>
<script src="js/components/toast.js"></script>

<script src="js/components/header.js"></script>
<script src="js/components/mobile-nav.js"></script>
<script src="js/components/sidebar.js"></script>
<script src="js/components/post-card.js"></script>
<script src="js/components/video-card.js"></script>
<script src="js/components/state-card.js"></script>
<script src="js/components/event-card.js"></script>
<script src="js/components/business-card.js"></script>
<script src="js/pages/profile.js"></script>
<script src="js/app.js"></script>
</body>
</html>
