<body data-root="" data-page="edit-profile" data-nav="">
<div class="page">
<div id="site-header"></div>
<div class="page-head"><h1>Edit profile</h1></div>
<div class="compose">
  <form class="card form" id="profile-form" novalidate style="padding:24px">
    <div class="field">
      <label for="display_name">Display name</label>
      <input class="input" id="display_name" name="display_name" data-rules="required" placeholder="e.g. Tunde Adebayo">
      <span class="error"></span>
    </div>
    <div class="field">
      <label for="username">Username</label>
      <input class="input" id="username" name="username" data-rules="username" disabled style="opacity:0.7" title="Username is unique to your account">
      <span class="error"></span>
    </div>
    <div class="field">
      <label for="state">Nigerian State / Location</label>
      <select class="input" id="state" name="state">
        <option value="">Select your state</option>
      </select>
    </div>
    <div class="field">
      <label for="bio">Bio</label>
      <textarea class="textarea" id="bio" name="bio" style="min-height:90px" placeholder="Tell the community what part of Nigeria you represent or what you love..."></textarea>
    </div>
    <div class="field">
      <label for="website">Website / Portfolio link</label>
      <input class="input" id="website" name="website" placeholder="https://yourbrand.ng">
    </div>
    <div class="field">
      <label for="phone">Phone / WhatsApp (Optional)</label>
      <input class="input" id="phone" name="phone" placeholder="+234 800 000 0000">
    </div>
    <div class="field">
      <label for="avatar">Profile photo</label>
      <input class="input" type="file" id="avatar" name="avatar" accept="image/jpeg,image/png,image/webp">
      <small class="muted" style="display:block;margin-top:4px">Upload a square JPEG, PNG, or WebP photo up to 5MB.</small>
    </div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn btn-primary" type="submit" id="save-profile-btn">Save changes</button>
      <a class="btn btn-outline" href="profile.html">Cancel</a>
    </div>
  </form>
</div>
<div id="site-footer"></div>
</div>
